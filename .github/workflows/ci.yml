name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal

    env:
      # CI-only values; never real secrets. Tests use a tmp auth DB.
      BETTER_AUTH_SECRET: ci-fixed-secret-not-used-in-prod
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint
        # Fail on any ESLint error or warning. The portal's .eslintrc.json
        # is configured for non-interactive use.

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  cli:
    name: CLI (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Ruff check (CLI + plugins + tests)
        run: ruff check .
        working-directory: .

      - name: Pytest
        run: pytest tests/ -v

  ops-scripts:
    name: Ops scripts (bash + shellcheck gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash -n + shellcheck (required, no `|| true`)
        run: |
          set -e
          for f in deploy.sh scripts/*.sh packages/ops/*.sh; do
            echo "→ bash -n $f"
            bash -n "$f"
          done
          # shellcheck is now a hard gate — no `|| true`. SC2155 is excluded
          # because provision-client.sh intentionally combines declare+assign
          # for readability of long var assignments.
          shellcheck -e SC2155 deploy.sh scripts/*.sh packages/ops/*.sh

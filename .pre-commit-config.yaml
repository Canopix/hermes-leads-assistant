# Pre-commit hooks for the Hermes Leads Assistant monorepo.
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
#
# Hooks are LOCAL (no remote repo deps) so this works offline and on CI
# runners without network access. Update versions when bumping deps.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(cli|packages/hermes-dist|tests)/.*\.py$
      - id: ruff-format
        files: ^(cli|packages/hermes-dist|tests)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|json|css|md|ya?ml)$
        exclude: |
          (?x)^(
            pnpm-lock\.yaml|
            \.codegraph/.*|
            apps/portal/\.next/.*|
            node_modules/.*
          )$

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.2
    hooks:
      - id: shellcheck
        # SC2155: declare and assign separately — we do this intentionally
        # in provision-client.sh for readability of long var assignments.
        args: [--exclude=SC2155]

  - repo: local
    hooks:
      - id: portal-eslint
        name: Portal ESLint
        entry: bash -c 'cd apps/portal && pnpm exec eslint src --ext .ts,.tsx'
        language: system
        files: ^apps/portal/src/.*\.(ts|tsx)$
        pass_filenames: false
        types: [file]

      - id: portal-type-check
        name: Portal type-check
        entry: bash -c 'cd apps/portal && pnpm type-check'
        language: system
        files: ^apps/portal/.*\.tsx?$
        pass_filenames: false
        types: [file]

      - id: bash-syntax
        name: bash -n on shell scripts
        entry: bash -n
        language: system
        files: \.(sh|bash)$
        types: [shell]

      - id: forbid-secrets-in-env
        name: Block real secrets from being committed in .env files
        entry: bash -c '
          if git diff --cached --name-only | grep -E "(^|/)\.env(\.|$)" | grep -vE "\.example$|\.EXAMPLE$" ; then
            echo "[pre-commit] refusing to commit a non-example .env file" ;
            exit 1 ;
          fi
          '
        language: system
        pass_filenames: false
        always_run: true
